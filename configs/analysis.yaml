project:
  name: clinical_ai_evaluation
  random_seed: 42

paths:
  outputs: outputs
  analysis_file: data/processed/all_countries_reviews.csv

cache:
  enabled: true
  directory: "outputs/cache"
  
analysis:
  safety_var: safety_score
  save_outputs: true
  ni_margin: -0.20
  ni_alpha: 0.025
  bootstrap_iterations: 2000
  bootstrap_seed: 42
  confidence_level: 0.95
  

visualization:
  figure_width: 8
  figure_height: 5
  dpi: 300

models:
  order:
    - "Human Benchmark"
    - "Apertus-Meditron"
    - "Qwen 3"
    - "MedGemma"
    - "Meditron CHUV"
    - "GPT-OSS"
    - "GPT-5.5"
  friendly_names:
    Human Benchmark: Human Benchmark
    Qwen 3: Qwen 3

criteria:
  friendly_names:
    clinical_soundness_score: Clinical soundness
    safety_score: Safety

model_categories:
  Human Benchmark: Human
  Qwen 3: Open-weight LLM

category_colors:
  Human: "#555555"
  Open-weight LLM: "#1c9487"