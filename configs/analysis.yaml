project:
  name: clinical_ai_evaluation
  random_seed: 42

paths:
  outputs: outputs
  analysis_file: data/processed/ethiopia_preprocessed_reviews.csv

cache:
  enabled: true
  directory: "outputs/cache"
  
analysis:
  safety_var: safety_score
  save_outputs: true
  bootstrap_iterations: 2000
  bootstrap_seed: 42
  confidence_level: 0.95
  
analyses:
  adjusted_mean_score: true
  safety_pairwise_comparisons: true
  win_loss: true
  position_effect: true
  inter_rater_agreement: true
  variance: true
  gap_between_scores: true

models:
  order:
    - "Human Benchmark"
    - "Apertus-Meditron"
    - "Qwen 3"
    - "MedGemma"
    - "Meditron CHUV"
    - "GPT-OSS"
    - "GPT-5.5"
  friendly_names:
    Human Benchmark: Human Benchmark
    Qwen 3: Qwen 3

criteria:
  friendly_names:
    clinical_soundness_score: Clinical soundness
    safety_score: Safety

model_categories:
  Human Benchmark: Human
  Qwen 3: Open
  "Apertus-Meditron": Fully Open
  "MedGemma": Open
  "Meditron CHUV": Open
  "GPT-OSS": Open
  "GPT-5.5": Closed

agreement:
  weight: linear
  methods:
    "gwet_ac2": gwet
    "krippendorff_alpha": krippendorff
