project:
  name: clinical_ai_evaluation
  random_seed: 42

paths:
  raw_data: data/raw
  processed_data: data/processed
  outputs: outputs

data:
  countries:
    - name: kenya
      answers: Kenya PHC - Answers.csv
      reviews: Kenya PHC - Reviews.csv

    - name: malawi
      answers: answers.csv
      reviews: reviews.csv

    - name: ethiopia
      answers: EMped Ethiopia - Answers.csv
      reviews: EMped Ethiopia - Reviews.csv

analysis:
  bootstrap_iterations: 2000
  confidence_level: 0.95

visualization:
  format: pdf
  dpi: 300