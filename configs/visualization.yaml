project:
  name: clinical_ai_evaluation

paths:
  outputs: outputs
  figures: outputs/figures
  
  # input file for each statistical analysis
  analysis_inputs:
    llm_performance:
      adjusted_mean_score: outputs/docs/20261016/clinical_ai_evaluation_adjusted_mean_score_131615.xlsx
      safety_pairwise_comparisons: outputs/docs/20261016/clinical_ai_evaluation_safety_pairwise_comparisons_131635.xlsx
    h2h_comparison:
      win_loss: outputs/docs/20261016/clinical_ai_evaluation_win_loss_analysis_130055.xlsx
    irr_and_variance:
      inter_rater_agreement: outputs/docs/20261016/clinical_ai_evaluation_inter_rater_agreement_130057.xlsx
      variance: outputs/docs/20261016/clinical_ai_evaluation_variance_components_130300.xlsx
    consistency_of_scores_over_same_response:
      gap_between_scores: outputs/docs/20261016/clinical_ai_evaluation_scores_gap_130301.xlsx
    effect_of_response_display_position:
      position_effect: outputs/docs/20261016/clinical_ai_evaluation_preferred_side_analysis_130057.xlsx

plots:

  save_outputs: true
  format: pdf
  dpi: 300
  bbox_inches: tight

  # Default figure dimensions (in inches)
  figure:
    width: 10
    height: 6

  # Font sizes (in points)
  fonts:
    family: sans-serif
    title: 12
    subtitle: 11
    axis_label: 10
    tick_label: 9
    legend: 9
    annotation: 9
    panel_label: 12

  # Country-specific colors

  countries:
    ethiopia: "#1C9487"
    Malawi: "#BE7325"
    Tanzania: "#424F8D"

  # Colors for general comparisons
  comparisons:
    positive: "#217B3B"
    neutral: "#C7C6C1"
    negative: "#772B83"

  # Other reusable colors
  general:
    primary: "#105091"
    secondary: "#7C7F82"
    grid: "#D9D9D9"

  # Select which figures to generate
  analyses:
    llm_performance: true
    h2h_comparison: true
    irr_and_variance: true
    consistency_of_scores_over_same_response: true
    effect_of_response_display_position: true

